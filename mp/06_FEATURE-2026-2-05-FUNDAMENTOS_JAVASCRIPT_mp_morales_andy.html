<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador | Jardín Soleado</title>
  <link rel="stylesheet" href="urbanizacion.css">
</head>
<body>
  <header><h1>Calcula el valor de tu vivienda</h1><p>Elige un modelo y conoce un precio estimado.</p></header>
  <main>
    <form id="cotizador">
      <label for="habitaciones">Número de habitaciones</label>
      <input id="habitaciones" type="number" min="1" max="5" value="2" required>
      <label for="plan">Plan de vivienda</label>
      <select id="plan">
        <option value="parque">Plan Parque</option>
        <option value="familiar">Plan Familiar</option>
      </select>
      <button type="submit">Calcular estimado</button>
    </form>
    <p id="resultado" aria-live="polite">Elige las características de tu vivienda.</p>
  </main>
  <footer><p>Conjunto residencial Jardín Soleado</p></footer>
  <script src="06_FEATURE-2026-2-05-FUNDAMENTOS_JAVASCRIPT_mp_morales_andy.js"></script>
</body>
</html>
