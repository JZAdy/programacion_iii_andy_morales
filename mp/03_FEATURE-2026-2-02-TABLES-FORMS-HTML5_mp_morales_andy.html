<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disponibilidad | Jardín Soleado</title>
  <link rel="stylesheet" href="urbanizacion.css">
  <link rel="stylesheet" href="03_FEATURE-2026-2-02-TABLES-FORMS-HTML5_mp_morales_andy.css">
</head>
<body>
  <header><h1>Encuentra tu hogar</h1><p>Consulta modelos disponibles y solicita una visita.</p></header>
  <main>
    <section>
      <h2>Viviendas disponibles</h2>
      <table>
        <thead><tr><th>Modelo</th><th>Habitaciones</th><th>Área</th><th>Estado</th></tr></thead>
        <tbody>
          <tr><td>Parque</td><td>2</td><td>82 m²</td><td>Disponible</td></tr>
          <tr><td>Familiar</td><td>3</td><td>110 m²</td><td>Disponible</td></tr>
          <tr><td>Jardín</td><td>3</td><td>104 m²</td><td>Próxima entrega</td></tr>
        </tbody>
      </table>
    </section>
    <section>
      <h2>Solicita información</h2>
      <form action="mailto:visitas@jardinesoleado.example" method="post" enctype="text/plain">
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" required>
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" required>
        <label for="modelo">Modelo de interés</label>
        <select id="modelo" name="modelo">
          <option>Parque</option><option>Familiar</option><option>Jardín</option>
        </select>
        <button type="submit">Enviar solicitud</button>
      </form>
    </section>
  </main>
  <footer><p>Conjunto residencial Jardín Soleado</p></footer>
</body>
</html>
