<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello CSS</title>
    <style>
        h1 {
            color: blueviolet;
        }
        p {
            color: brown;
        }
    </style>
    <link rel="stylesheet" href="01_hello_css.css">
</head>
<body>
    <h1>Maneras de incluir Estilos CSS en un archivo HTML</h1>
    <h1 style="color: gold;">Hello world con CSS- Tipo inline</h1>
    <h2>Estilos CSS - Interno</h2>
    <p>Esta es la manera de incluir estilos de tipo interno, colocandolos estilos en el head del HTML</p>
    <h3>Estilos CSS - Externo</h3>
    <a>Se incluyo estilo a travez de un archivo externo</a> 
</body>
</html>
