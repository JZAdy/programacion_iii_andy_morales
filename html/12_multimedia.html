<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
</head>
<body>
    <h1>Multimedia</h1>
    <h2>Reproducir sonido</h2>
    <audio id="audio" src="videos/herta.mp3" 
    controls 
    autoplay 
    loop>tu navegador no soporta el elemento de audio.</audio>

    <video id="video" src="videos/herta.mp4" 
    controls
    width="500">tu navegador no soporta el elemento de video.</video>

    <iframe src="https://www.wikipedia.org/"
            width="500"
            height="300"
            title="herta"
            loading="lazy">
    </iframe>
</body>
</html>
